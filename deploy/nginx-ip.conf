# Standalone IP virtual host; do not overwrite a Hestia-generated site config.
# Confirm this IP is not already assigned as another site's server_name first.
server {
    listen 129.121.103.232:80;
    server_name 129.121.103.232;

    root /var/www/secure-notes;
    index index.html;
    client_max_body_size 64k;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace any browser-supplied forwarded address before trusting loopback.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
